name: TinyPC-NPU CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: RTL, Model, Lint, and Synthesis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run RTL and Python regression
        run: make test

      - name: Run strict Verilator lint
        run: make lint

      - name: Run Yosys synthesizability check
        run: make synth-check
